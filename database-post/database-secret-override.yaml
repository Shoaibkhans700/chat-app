# Apply this AFTER k8s/secret.yaml — it replaces just the `database-secret`
# Secret's data, leaving `backend-secret` (also defined in k8s/secret.yaml,
# holds JWT_SECRET_KEY) untouched.
#
# The backend reads DB_USERNAME/DB_PASSWORD; Postgres itself reads
# POSTGRES_USER/POSTGRES_PASSWORD (different key names, in postgres-secret.yaml).
# These two values are kept identical on purpose so the same credentials
# work on both sides of the connection - see postgres-secret.yaml.
apiVersion: v1
kind: Secret
metadata:
  name: database-secret
  namespace: chat-app
type: Opaque
data:
  DB_USERNAME: Y2hhdGFwcA==                    # chatapp
  DB_PASSWORD: Y2hhdGFwcC1sb2NhbC1vbmx5         # chatapp-local-only
