apiVersion: v1
kind: ConfigMap
metadata:
  name: database-config
  namespace: chat-app
data:
  DB_HOST: "postgres"
  DB_PORT: "5432"
  DB_NAME: "chatapp"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: chat-app
data:
  JWT_ALGORITHM: "HS256"
  JWT_EXPIRE_MINUTES: "60"
  CORS_ORIGINS: "https://chat.example.com"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-config
  namespace: chat-app
data:
  BACKEND_URL: "http://backend-service.chat-app.svc.cluster.local:8000"
