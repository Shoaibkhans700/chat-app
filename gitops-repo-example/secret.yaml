# -----------------------------------------------------------------------
# PLACEHOLDER VALUES ONLY. Do not put real credentials in this file or in
# Git. Kubernetes Secrets are base64-ENCODED, not encrypted - anyone with
# `kubectl get secret -o yaml` access (or repo access, if this file were
# real) can trivially decode them.
#
# Generate real values locally and apply them out-of-band instead:
#   kubectl create secret generic database-secret \
#     --namespace chat-app \
#     --from-literal=DB_USERNAME='<real-username>' \
#     --from-literal=DB_PASSWORD='<real-password>'
#
# For production, prefer AWS Secrets Manager + the External Secrets
# Operator (see README.md "Kubernetes Secrets" section) so the value
# never has to live in a YAML file or a kubectl history at all.
# -----------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: database-secret
  namespace: chat-app
type: Opaque
data:
  DB_USERNAME: UkVQTEFDRV9XSVRIX1VTRVJOQU1F      # base64("REPLACE_WITH_USERNAME")
  DB_PASSWORD: UkVQTEFDRV9XSVRIX1BBU1NXT1JE       # base64("REPLACE_WITH_PASSWORD")
---
apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
  namespace: chat-app
type: Opaque
data:
  JWT_SECRET_KEY: UkVQTEFDRV9XSVRIX0FfTE9OR19SQU5ET01fU0VDUkVU   # base64("REPLACE_WITH_A_LONG_RANDOM_SECRET")
